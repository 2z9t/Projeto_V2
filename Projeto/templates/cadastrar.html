<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta no ProENEM Lab e comece a estudar com foco no ENEM.">
    <link rel="canonical" href="{{ url_for('cadastrar', _external=True) }}">

    <meta property="og:site_name" content="ProENEM Lab">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Seja bem vindo!">
    <meta property="og:description" content="Crie sua conta no ProENEM Lab e comece a estudar com foco no ENEM.">
    <meta property="og:url" content="{{ url_for('cadastrar', _external=True) }}">
    <meta property="og:image" content="{{ url_for('static', filename='assets/images/lb_book.webp', _external=True) }}">
    <meta property="og:image:alt" content="ProENEM Lab">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Seja bem vindo!">
    <meta name="twitter:description" content="Crie sua conta no ProENEM Lab e comece a estudar com foco no ENEM.">
    <meta name="twitter:image" content="{{ url_for('static', filename='assets/images/lb_book.webp', _external=True) }}">

    <title>ProENEM Lab - Seja bem vindo!</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/images/lb_book_favicon.png') }}" type="image/png">
    <link rel="preload" href="{{ url_for('static', filename='assets/fonts/Raleway-VariableFont_wght.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_1_l.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: light)">
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_2_l.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: light)">
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_3_l.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: light)">
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_1_d.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: dark)">
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_2_d.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: dark)">
    <link rel="preload" href="{{ url_for('static', filename='assets/images/layer_3_d.webp') }}" as="image" type="image/webp" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/presets.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth_page_register">
    <div id="auth_form_container" aria-label="Formulário de autenticação">
        <div id="style_section_toggle_theme_button" role="toolbar" aria-label="Tema da interface">
            <button type="button" class="toggle_theme_button_input" id="toggle_theme_button_input_light">
                <img src="{{ url_for('static', filename='assets/images/sun.webp') }}" alt="" width="16" height="16" aria-hidden="true">
                <span class="visually_hidden">Tema claro</span>
            </button>
            <button type="button" class="toggle_theme_button_input" id="toggle_theme_button_input_dark">
                <img src="{{ url_for('static', filename='assets/images/moon.webp') }}" alt="" width="16" height="16" aria-hidden="true">
                <span class="visually_hidden">Tema escuro</span>
            </button>
            <button type="button" class="toggle_theme_button_input" id="toggle_theme_button_input_system">
                <img src="{{ url_for('static', filename='assets/images/device.webp') }}" alt="" width="16" height="16" aria-hidden="true">
                <span class="visually_hidden">Usar tema do dispositivo</span>
            </button>
        </div>
        <main id="auth_form_main">
        <form novalidate id="auth_form_content">
            <div id="auth_form_content_header_container">
                <h1 id="auth_form_content_header_title">Estude como se o <span class="highlighted_text">ENEM</span> fosse amanhã</h1>
            </div>
            <div id="auth_form_content_container">
                <div class="auth_form_content_input_container" id="auth_form_content_username_container">
                    <div class="auth_form_content_input_title_container">
                        <label class="auth_form_content_input_title" id="auth_form_content_username_title" for="auth_form_content_username_input">Apelido</label>
                        <span class="auth_form_content_input_title_error" id="auth_form_content_username_title_error"></span>
                    </div>
                    <input type="text" class="auth_form_content_input" id="auth_form_content_username_input" name="username" autocomplete="off" inputmode="text" minlength="3" maxlength="32" title="Letras, números ou sublinhado, entre 3 e 32 caracteres." required>
                </div>
                <div class="auth_form_content_input_container" id="auth_form_content_email_container">
                    <div class="auth_form_content_input_title_container">
                        <label class="auth_form_content_input_title" id="auth_form_content_email_title" for="auth_form_content_email_input">Email</label>
                        <span class="auth_form_content_input_title_error" id="auth_form_content_email_title_error"></span>
                    </div>
                    <input type="email" class="auth_form_content_input" autocomplete="email" inputmode="email" id="auth_form_content_email_input" required>
                </div>
                <div class="auth_form_content_input_container" id="auth_form_content_password_container">
                    <div class="auth_form_content_input_title_container">
                        <label class="auth_form_content_input_title" id="auth_form_content_password_title" for="auth_form_content_password_input">Senha</label>
                        <span class="auth_form_content_input_title_error" id="auth_form_content_password_title_error"></span>
                    </div>
                    <div class="auth_form_content_password_wrap">
                        <input type="password" class="auth_form_content_input" autocomplete="new-password" id="auth_form_content_password_input" required>
                        <button type="button" class="auth_form_content_password_toggle" id="auth_form_content_password_toggle" aria-label="Mostrar senha digitada" aria-pressed="false">
                            <svg class="auth_form_content_password_toggle_svg" id="auth_form_content_password_toggle_icon_closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                                <ellipse cx="12" cy="12" rx="9" ry="5.25" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                                <path d="M4 12.25h16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                            </svg>
                            <svg class="auth_form_content_password_toggle_svg" id="auth_form_content_password_toggle_icon_open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                                <ellipse cx="12" cy="12" rx="9" ry="5.25" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="2.35" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="auth_password_strength" id="auth_password_strength" aria-label="Indicador de força da senha" aria-live="polite">
                        <div class="auth_password_strength_row">
                            <span class="auth_password_strength_label" id="auth_password_strength_label">Força: fraca</span>
                            <span class="auth_form_content_password_hint" id="auth_form_content_password_hint">Deve ter pelo menos 8 caracteres</span>
                        </div>
                    </div>
                </div>
                <div class="auth_form_content_terms_container" id="auth_form_content_terms_container">
                    <label for="auth_form_content_terms_checkbox" id="auth_form_content_terms_label">
                        <span id="auth_form_content_terms_text">Eu li e concordo plenamente com os <a href="#" class="highlighted_text">termos de uso</a> e <a href="#" class="highlighted_text">políticas de privacidade</a>.</span>
                    </label>
                    <input type="checkbox" id="auth_form_content_terms_checkbox" aria-describedby="auth_form_content_terms_text auth_form_content_terms_error">
                    <svg id="auth_form_content_terms_checkmark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="bi bi-check" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/>
                    </svg>
                    <div class="auth_form_content_terms_error_slot">
                        <p class="auth_form_content_terms_error" id="auth_form_content_terms_error" role="alert" aria-live="polite"></p>
                    </div>
                </div>
            </div>
            <div id="auth_form_content_footer_container">
                <button type="submit" class="auth_form_content_footer_button" id="auth_form_content_submit_button">Criar conta</button>
                <div id="auth_form_content_footer_text_container">
                    <span id="auth_form_content_footer_text">Já tem uma conta? </span>
                    <a href="{{ url_for('entrar') }}" class="highlighted_text" id="auth_form_content_footer_text_link">Entrar</a>
                </div>
            </div>
        </form>
        </main>
    </div>
    <div id="auth_style_container" aria-hidden="true" role="presentation">
        <div id="auth_style_container_custom_layer">
            <div id="auth_style_section_first_content">
                <div class="auth_style_section_first" id="auth_style_section_first_layer_1"></div>
                <div class="auth_style_section_first" id="auth_style_section_first_layer_2"></div>
                <div class="auth_style_section_first" id="auth_style_section_first_layer_3"></div>
            </div>
        </div>
    </div>
    <span id="auth_style_section_title">Pro<span class="highlighted_text">ENEM</span> Lab</span>
    <script src="{{ url_for('static', filename='js/global.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</body>
</html>
